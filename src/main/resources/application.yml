spring:
  application:
    name: LexHive
  datasource:
    url: jdbc:postgresql://localhost:5434/lexhive
    username: lexhive
    password: lexhive
  flyway:
    enabled: true
    connect-retries: 20
    connect-retries-interval: 2
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
      readiness:
        timeout: 3m

lexhive:
  borrowing:
    max-active-loans: 3
    loan-duration-days: 14
  security:
    jwt-secret: Library_system_LexHive_Secret_Key
    token-expiry-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: LIBRARIAN
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: LexHive
    description: Book lending service

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
