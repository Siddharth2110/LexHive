spring:
  application:
    name: LexHive
  datasource:
    url: jdbc:postgresql://localhost:5434/lexhive
    username: lexhive
    password: lexhive
  flyway:
    enabled: true
    connect-retries: 20
    connect-retries-interval: 2
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
      readiness:
        timeout: 3m

lexhive:
  borrowing:
    max-active-loans: 3
    loan-duration-days: 14
  security:
    jwt:
      # Development signing key only. Set LEXHIVE_JWT_SECRET outside local use.
      secret: ${LEXHIVE_JWT_SECRET:dev-only-lexhive-jwt-signing-key-32}
      expiration: 1h
    users:
      - username: alice
        password: '$2a$10$oSHkb7Vi7E8X.a4tpF4pVeXR0RpcUiSm.DzvaGsGffJnpdb4WTL8K'
        role: MEMBER
      - username: librarian
        password: '$2a$10$OnauRb/662NP8v.RhXmX9u60FRMWf9qzh008CGohfWuYx3glXFjg2'
        role: LIBRARIAN
