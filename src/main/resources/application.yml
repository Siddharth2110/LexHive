spring:
  application:
    name: LexHive
  datasource:
    url: jdbc:postgresql://localhost:5434/lexhive
    username: lexhive
    password: lexhive
  flyway:
    enabled: true
    connect-retries: 20
    connect-retries-interval: 2
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
      readiness:
        timeout: 3m

lexhive:
  borrowing:
    max-active-loans: 3
    loan-duration-days: 14
  security:
    # HS256 needs at least 32 characters. Override with LEXHIVE_JWT_SECRET outside local dev.
    jwt-secret: Library_system_LexHive_Secret_Key
    token-expiry-minutes: 60
